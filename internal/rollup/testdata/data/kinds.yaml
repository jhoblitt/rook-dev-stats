kinds:
  - {id: bugfix, name: Bug fix}
  - {id: feature, name: Feature}
  - {id: cleanup, name: Cleanup}
  - {id: docs, name: Documentation}
  - {id: other, name: Other}
checklist: {new_feature: feature, very_recent_bug: bugfix, doc_update: docs, code_cleanup: cleanup}
tracker: {Bug: bugfix, Feature: feature, Backport: parent, Tasks: other}
labels: {bug-fix: bugfix, feature: feature, cleanup: cleanup}
order: [checklist, tracker, labels]
