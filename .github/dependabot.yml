# Managed by github-conventions (references/workflows.md); language plugins
# append their own package-ecosystem entries below this one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  # The Go entry, from go-conventions (references/ci.md, Dependabot), which
  # owns how it lands in .github/dependabot.yml.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    # svelte-check loads TypeScript 6's JavaScript API, so typescript stays on
    # 6; TypeScript 7 is installed beside it as @typescript/native.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
