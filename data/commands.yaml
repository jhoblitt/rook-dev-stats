# Comments that only trigger automation. A comment is a command when its
# whole text matches a pattern, in any case; the first command that
# matches, top to bottom, names it.
#
# A comment addressed to a bot is a command whether or not the bot acts
# on it: "/retest" asks for a test run and answers nobody, though nothing
# in rook/rook reads it. A comment that talks to people about the
# automation ("restarted ci", "added skip ci") is not, and neither is a
# Prow-style verdict such as "/lgtm" or "/hold", which tells the author
# what a reviewer thinks.
#
# A command addressed to Mergify or Dependabot starts with a mention of the
# bot, the only "@" extract keeps, or with the mention written as a link to
# the bot's GitHub page. Any white space may follow the handle, as it may
# where extract keeps the mention: one comment has a no-break space there.
commands:
  # Mergify, rook/rook's backport and merge-queue bot: "@mergifyio backport
  # release-1.21" opens a backport to that branch.
  - id: mergify-backport
    name: '@mergifyio backport'
    pattern: '(@|https://github\.com/)mergify(io)?[\s\v\x{85}\pZ]+backport( .+)?'
  - id: mergify-rebase
    name: '@mergifyio rebase'
    pattern: '(@|https://github\.com/)mergify(io)?[\s\v\x{85}\pZ]+rebase'
  - id: mergify-other
    name: '@mergifyio, another request'
    pattern: '(@|https://github\.com/)mergify(io)?[\s\v\x{85}\pZ]+.+'
  # Dependabot, which opens rook/rook's dependency updates.
  - id: dependabot-rebase
    name: '@dependabot rebase'
    pattern: '(@|https://github\.com/)dependabot[\s\v\x{85}\pZ]+rebase'
  - id: dependabot-other
    name: '@dependabot, another request'
    pattern: '(@|https://github\.com/)dependabot[\s\v\x{85}\pZ]+.+'
  # Jenkins, rook/rook's CI before GitHub Actions: "ok to test" lets it
  # test a pull request from outside the organisation, and "test this
  # please" or "retest this please" asks it for a run.
  - id: ok-to-test
    name: ok to test
    pattern: 'ok to test'
  - id: test-this-please
    name: test this please
    pattern: '(re)?test this please'
  # Prow-style requests to CI: "/retest", "/retest linters", "/test this".
  - id: retest
    name: /retest
    pattern: '/retest( .+)?'
  - id: test
    name: /test
    pattern: '/test .+'
  - id: rebase
    name: /rebase
    pattern: '/rebase'
  - id: label
    name: /label
    pattern: '/label .+'
  # Asks the stale workflow to drop its "stale" label.
  - id: remove-stale
    name: /remove stale
    pattern: '/?remove stale'
  # CI's skip directive, which CI reads from commit messages, posted as a
  # whole comment.
  - id: skip-ci
    name: '[skip ci]'
    pattern: '\[skip ci\]'
