# Accounts GitHub types as users whose comments and reviews are automated.
# Accounts GitHub types as bots need no entry. Logins match in any case.
accounts:
  - login: jenkins-rook
    why: >-
      rook/rook's Jenkins CI. Its one comment in the window is a "Test
      Status" note.
  - login: fossabot
    why: >-
      FOSSA's license-scan integration. It opened one pull request, in
      January 2018, adding a license-scan badge, and commented on it with
      the scan's result; both are FOSSA's templates.
  - login: snyk-bot
    why: >-
      Snyk's dependency scanner. It opened two "[Snyk] Security upgrade"
      pull requests in November 2021 for a container base image.
  - login: step-security-bot
    why: >-
      StepSecurity's workflow-hardening app. It opened one pull request, in
      October 2023, at a maintainer's request, from its template: "ci:
      Harden GitHub Actions permissions".
  - login: WSandboxedOCCodeBot
    why: >-
      An automated coding agent. It opened one pull request, in February
      2026, a Go version bump citing a scanner's CVE findings, signed off
      with a bot address.
