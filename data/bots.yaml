# Accounts GitHub types as users whose comments and reviews are automated.
# Accounts GitHub types as bots need no entry. Logins match in any case.
accounts:
  - login: ceph-jenkins
    why: >-
      ceph/ceph's Jenkins. Every one of its comments in the window is one of
      three templates: a "Thank you for your contribution" note, "Can one of
      the admins verify this patch?", and a doc-render link. The pull
      requests it opens are the release-version bumps (v19.2.5, v20.2.3, …).
  - login: loic-bot
    why: >-
      A make check bot, active from November 2014 to December 2015. The
      comments whose text is kept are run results ("SUCCESS", "FAILED" or
      "ABORTED" with a link to the log); the others are not short single
      lines, so their text is not kept. One kept comment says a person
      posted it from this account by mistake.
