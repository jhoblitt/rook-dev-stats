# What each label says about a pull request. An entry is a label's name,
# in which `*` stands for any run of characters, `/` included, and every
# other character for itself. `rookstats check`
# fails on a label carried by 5 or more pull requests that no entry here,
# and no kind label in kinds.yaml, classifies.

# A pull request with two component labels belongs to both components.
# rook/rook's maintainers set these by hand; most pull requests carry none.
components:
  # daemon marks the 2018-2019 work on how the operator configures the Ceph
  # daemons it runs: their config files and init containers.
  - id: operator
    name: Operator
    labels: [operator, daemon]
  - id: block
    name: Block
    labels: [block]
  # ceph-mds marks CephFS's metadata server.
  - id: filesystem
    name: File system
    labels: [filesystem, ceph-mds]
  # ceph-rgw marks the Ceph Object Gateway, which serves Rook's object
  # stores; object-bucket-claims and object-cosi, the two ways Rook
  # provisions buckets for applications.
  - id: object
    name: Object
    labels: [object, ceph-rgw, object-bucket-claims, object-cosi]
  - id: nfs
    name: NFS
    labels: [ceph-nfs]
  - id: nvmeof
    name: NVMe-oF
    labels: [nvmeof]
  # discover marks the discovery daemon, which finds the devices OSDs can
  # use.
  - id: osd
    name: OSD
    labels: [ceph-osd, discover]
  - id: mon
    name: Monitor
    labels: [ceph-mon]
  - id: mgr
    name: Manager
    labels: [ceph-mgr]
  - id: dashboard
    name: Dashboard
    labels: [ceph-dashboard]
  # ceph-exporter marks the daemon that exports the Ceph daemons'
  # performance counters to Prometheus.
  - id: monitoring
    name: Monitoring
    labels: [monitoring, ceph-exporter]
  - id: csi
    name: CSI
    labels: [csi]
  # multus marks Multus, through which Rook attaches Ceph to networks other
  # than the cluster's own.
  - id: networking
    name: Networking
    labels: [networking, multus]
  # The work, from 2025, on rotating the CephX keys of every daemon and
  # client Rook creates.
  - id: cephx-rotation
    name: CephX key rotation
    labels: [cephx-rotation]
  # crd marks changes to the custom resource definitions, 2019 to 2021.
  - id: api
    name: API (CRDs)
    labels: [crd, api]
  - id: helm
    name: Helm charts
    labels: [helm]
  - id: build
    name: Build
    labels: [build]
  - id: ci
    name: CI
    labels: [ci]
  - id: tests
    name: Tests
    labels: [test]

# Where a pull request is in the review, test, backport and merge process.
process:
  # Asks Mergify to backport the pull request once merged:
  # backport-release-1.20, … A plain backport mostly marks a backport opened
  # by hand.
  - 'backport*'
  - do-not-backport
  # Rook triggers its optional CI suites by label: debug-ci,
  # debug-multi-cluster-mirroring, debug-canary, … skip-ci skips the
  # suites that a change cannot affect.
  - 'debug-*'
  - skip-ci
  - do-not-merge
  - WIP
  # Set by Mergify on a backport it opened whose cherry-pick conflicts.
  - conflicts
  # Set by Mergify when it takes a pull request out of its merge queue.
  - dequeued
  # The stale workflow's label, and the label that exempts a pull request
  # from it.
  - stale
  - keepalive
  - wontfix
  - invalid

# Labels that are neither: what the change is for beyond its kind, a design
# document, and the dependency-update bot's own labels.
other:
  - security
  - reliability
  - upgrade
  - configuration
  - logs
  - deprecation
  - design
  # Dependabot's labels for the ecosystem it updates; it also sets
  # dependencies, a kind label in kinds.yaml.
  - go
  - github_actions
