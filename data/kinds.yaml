# What kind of change a pull request is. A backport takes the kind of the
# pull request it names when that one is in the data and has a kind;
# otherwise the sources below are tried in `order`, and a pull request none
# of them decides is unknown.

# The kinds, in the order the site shows them. `unknown`, `all` and
# `parent` are reserved.
kinds:
  - {id: bugfix, name: Bug fix}
  - {id: feature, name: Feature}
  - {id: cleanup, name: Cleanup}
  - {id: docs, name: Documentation}
  - {id: other, name: Other}

# A ticked box of the PR template. It decides only when every ticked box
# listed here names the same kind; "References tracker ticket" names none.
checklist:
  new_feature: feature
  very_recent_bug: bugfix
  doc_update: docs
  code_cleanup: cleanup

# A tracker ticket's type. The first referenced ticket whose type gives a
# kind decides; `parent` stands for the type of the ticket a Backport
# ticket was copied from.
tracker:
  Bug: bugfix
  Feature: feature
  Enhancement: feature
  Cleanup: cleanup
  Documentation: docs
  Backport: parent
  Support: other
  Tasks: other
  Subtask: other
  QA Run: other
  QA Review: other
  Motion: other
  Election: other
  Assignment: other
  Working Group: other
  Ceph Release: other

# A label. It decides only when every kind label the pull request carries
# names the same kind.
labels:
  bug: bugfix
  feature: feature
  code enhancement: feature
  docs: docs
  code cleanup: cleanup
  technical debt: cleanup
  # Dependabot's label on every update it opens.
  dependencies: other

order: [checklist, tracker, labels]
