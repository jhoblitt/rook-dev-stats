# What kind of change a pull request is. A backport takes the kind of the
# pull request it names when that one is in the data and has a kind;
# otherwise the sources below are tried in `order`, and a pull request none
# of them decides is unknown.

# The kinds, in the order the site shows them. `unknown` and `all` are
# reserved.
kinds:
  - {id: bugfix, name: Bug fix}
  - {id: feature, name: Feature}
  - {id: cleanup, name: Cleanup}
  - {id: docs, name: Documentation}
  - {id: other, name: Other}

# A label of the pull request. It decides only when every kind label the
# pull request carries names the same kind.
labels:
  bug: bugfix
  feature: feature
  code enhancement: feature
  docs: docs
  code cleanup: cleanup
  technical debt: cleanup
  # Dependabot's label on every update it opens.
  dependencies: other

# A label of an issue the pull request closes, as GitHub links them. The
# first issue whose kind labels all name the same kind decides. Only the
# issues of rook/rook count: another project's labels mean other things.
# GitHub links closing issues only for pull requests to the default branch,
# so a backport takes its kind from its original. Issues and pull requests
# share the repository's labels, so this lists the same kind labels as
# `labels` above; labels that name an area, such as `test`, `build` or
# `ci`, say nothing about the kind of change.
issue_labels:
  bug: bugfix
  feature: feature
  code enhancement: feature
  docs: docs
  code cleanup: cleanup
  technical debt: cleanup

order: [labels, issues]
