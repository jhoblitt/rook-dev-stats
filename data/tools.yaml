# What counts as a disclosure of AI use, and which tool it names.
#
# Phrases and family patterns are regular expressions matched anywhere in
# a candidate line, in any case. `rookstats check` lists the candidates
# that match no phrase, and fails on a counted disclosure that matches no
# family or a trailer whose key is not covered here.

# A commit trailer with one of these keys discloses by itself. A kept
# Co-authored-by: is a co-author disclosure without being listed here.
trailer_keys:
  - assisted-by
  - claude-session
  # Generated-by, naming the model that generated the commit. rook/rook's AI
  # guidelines permit it beside Assisted-by and Co-authored-by.
  - generated-by

# A description or commit-prose line counts only when it matches one of
# these: a tool's name alone is not a disclosure, and neither is talk
# about a tool (a review it gave, a policy on using it, a file for it).
phrases:
  # An Assisted-by trailer pasted into prose, or the same words in a sentence.
  - 'assist(ed|ant)[ -]by'
  # Assisted with AI, assited by AI.
  - '\bassis?ted (with|by) (an? )?(ai|llm)\b'
  # Made, written, found, … with, by, using, via or from a tool or an AI.
  - '\b(generated|raised|written|rewritten|drafted|developed|prepared|created|made|coded|done|discovered|found|identified|fixed|patched|prototyping|prototyped)\b[^.]{0,30}?\b(with|by|using|via|from)\W+(github )?(claude|codex|copilot|cursor|gemini|chatgpt|gpt|ibm[ -]bob|(an? )?(llm|ai)\b|([\w-]+ ){1,2}ai\b)'
  # With the help, aid or assistance of a tool or an AI.
  - '\b(help|aid|assistance|support) (of|from)\W+(github )?(claude|codex|copilot|cursor|gemini|chatgpt|gpt|ibm[ -]bob|(an? )?(llm|ai)\b)'
  # AI-assisted, AI assistance, AI-generated, LLM-drafted, AI assistants, …
  - '\b(ai|llm)s?[ -](assisted|assistance|assistants?|generated|drafted|written|aided)\b'
  # AI was used, AI tools assisted, AI tooling assisted, …
  - '\b(ai|llm)s?( tools?| tooling| agents?)? (was used|were used|is used|assisted|helped)\b'
  # The heading rook/rook's contributors put before a disclosure: "AI
  # disclosure:", "**AI usage disclosure:**", "_AI assistance disclosure:",
  # whose leading underscore defeats \b.
  - '(^|[\W_])(ai|llm)[ -](usage |use |assistance )?disclosure[*_]*:'
  # GitHub Copilot was used, Claude was used, …
  - '\b(github )?(claude|copilot|codex|cursor|gemini|chatgpt|ibm[ -]bob)( code)? (was|were) used\b'
  # I used Claude Code, used AI to …, used an AI coding assistant …
  - '\bused (github )?(claude|copilot|codex|cursor|gemini|chatgpt|ibm[ -]bob|ai|an? (llm|ai))\b'
  # Claude helped, an LLM that wrote this test, …
  - '\b(claude|copilot|codex|cursor|gemini|chatgpt|llm|ai)\b[\w -]{0,12}?\b(wrote|helped)\b'
  - '\bwith an? (llm|ai)\b'
  # A tool as the subject of the work: Claude traced, Claude mapped, …
  - '\b(claude|copilot|codex|cursor|gemini|chatgpt)( code)? (mapped|traced|drafted|located|implemented|verified|diagnosed|investigated|generated)\b'
  # AI (Claude) helped implement …
  - '\b(ai|llm) \((claude|copilot|codex|cursor|gemini|chatgpt)[^)]*\) (wrote|helped|drafted|implemented|located)\b'
  # The link Claude Code on the web adds to what it writes.
  - 'claude\.ai/code/session_'
  # The markers the Copilot coding agent leaves in the pull requests it opens.
  - '<!-- start copilot (coding agent|original prompt)'
  # A Co-authored-by trailer pasted into prose; extract keeps one only when
  # it names a tool.
  - '^co-authored-by:'

# The first family, top to bottom, that matches a counted disclosure is the
# tool it names. Tools that run another vendor's model come before the
# models, and unspecified comes last.
families:
  - id: copilot
    name: Copilot
    patterns: ['co-?pilot']
  - id: cursor
    name: Cursor
    patterns: ['\bcursor\b', 'cursoragent']
  - id: ibm-bob
    name: IBM Bob
    patterns: ['ibm[ -]bob']
  # Fable is a Claude model: "Claude Fable 5.1 <noreply@anthropic.com>".
  - id: claude
    name: Claude
    patterns: ['claude', 'anthropic', '\bfable\b']
  - id: openai
    name: OpenAI
    patterns: ['codex', 'chatgpt', '\bgpt', 'openai']
  - id: gemini
    name: Gemini
    patterns: ['gemini']
  - id: unspecified
    name: Unspecified
    patterns: ['\bllms?\b', '\bai\b']

# Candidate lines judged not to be a disclosure, each matched exactly.
ignore:
  # rook/rook's pull request template carries this box, and the template
  # does not say whether AI was used, ticked or not. A later change counts
  # a ticked box as its own, weakest form of disclosure; until then the
  # template's line counts as nothing.
  - line: '- [ ] Reviewed [AI guidelines](https://rook.io/docs/rook/latest/Contributing/ai-guidelines), if AI assisted with the PR.'
    why: the PR template's box, unticked; replaced when a ticked box is counted on its own
  - line: '- [x] Reviewed [AI guidelines](https://rook.io/docs/rook/latest/Contributing/ai-guidelines), if AI assisted with the PR.'
    why: the PR template's box, ticked; replaced when a ticked box is counted on its own
  - line: '- [X] Reviewed [AI guidelines](https://rook.io/docs/rook/latest/Contributing/ai-guidelines), if AI assisted with the PR.'
    why: the PR template's box, ticked; replaced when a ticked box is counted on its own
  - line: '- [X ] Reviewed [AI guidelines](https://rook.io/docs/rook/latest/Contributing/ai-guidelines), if AI assisted with the PR.'
    why: the PR template's box, ticked; replaced when a ticked box is counted on its own
  - line: '- [x] Reviewed AI guidelines, if AI assisted with the PR.'
    why: the PR template's box without its link, ticked; replaced when a ticked box is counted on its own
  - line: '### AI assistance disclosure (keep this, adapt the wording)'
    why: an instruction to whoever opens the pull request, left in its description
  - line: "AI-assistance disclosure (required by Rook's AI guidelines): add a short sentence"
    why: an instruction to whoever opens the pull request, left in its description
  - line: 'in your own words stating AI assisted with investigation/tests but you reviewed'
    why: an instruction to whoever opens the pull request, left in its description
  - line: '> opening the PR. The AI-assistance disclosure line must stay. Do not add'
    why: an instruction to whoever opens the pull request, left in its description
  - line: 'such as signing off and disclosing AI assistance. Everything mechanical, and'
    why: describes what an AGENTS.md asks of contributors, not a use of a tool
